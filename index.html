<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ställplatser">
  <meta name="description" content="Ställplatslistan - söder till norr">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Ställplats listan - söder till norr</title>
  <style>
    :root{--bg:#f5f7f6;--card:#fff;--text:#17312b;--muted:#66756f;--line:#dfe7e3;--accent:#0b6b5c;--accent2:#e5f2ee;--danger:#b42318;--shadow:0 2px 12px rgba(0,0,0,.06);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}body{padding-bottom:env(safe-area-inset-bottom)}
    header{position:sticky;top:0;z-index:10;background:rgba(245,247,246,.95);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
    h1{font-size:20px;margin:0 0 3px;letter-spacing:-.2px}.sub{font-size:12px;color:var(--muted)}
    .search{margin-top:10px;display:flex;gap:8px}.search input{flex:1;min-width:0;font-size:17px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.controls select,.controls button{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:15px;color:var(--text)}
    main{padding:12px 12px 28px;max-width:900px;margin:auto}.count{font-size:13px;color:var(--muted);margin:2px 2px 10px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow)}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:17px;font-weight:700;line-height:1.2}.place{font-size:13px;color:var(--muted);margin-top:3px}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);white-space:nowrap}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.meta div{background:#f7faf8;border-radius:10px;padding:8px 9px}.label{font-size:11px;color:var(--muted)}.value{font-size:14px;font-weight:600;margin-top:2px}
    .actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-size:14px}.actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}.actions .fav{flex:0 0 48px}
    .fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
    dialog{width:min(92vw,520px);border:0;border-radius:18px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.35)}.dlg{padding:18px}.dlg h2{margin:0 0 12px;font-size:19px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}.dlg-actions{display:flex;gap:8px;margin-top:15px}.dlg-actions button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px}.dlg-actions .save{background:var(--accent);border-color:var(--accent);color:#fff}
    .empty{text-align:center;color:var(--muted);padding:30px 12px}.smallbtn{font-size:12px;border:0;background:transparent;color:var(--accent);padding:4px}
    @media(min-width:700px){.controls{grid-template-columns:1.2fr .8fr .8fr}.card{padding:15px}.meta{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<header>
  <h1>🚐 Ställplats listan - söder till norr</h1>
  <div class="sub">Startpunkt: Israel Perssons väg, Åkersberga · 29 ställplatser</div>
  <div class="search"><input id="search" type="search" placeholder="Sök ställplats, område, landskap eller pris…" autocomplete="off"><button class="smallbtn" id="clearBtn" aria-label="Rensa">Rensa</button></div>
  <div class="controls">
    <select id="region"><option value="">Alla landskap</option></select>
    <select id="sort"><option value="order">Söder → norr</option><option value="name">Namn A–Ö</option><option value="region">Landskap A–Ö</option><option value="price">Pris lågt → högt</option></select>
    <button id="favFilter">☆ Favoriter: alla</button>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<button class="fab" id="addBtn" aria-label="Lägg till ställplats">+</button>

<dialog id="addDialog">
  <form class="dlg" id="addForm" method="dialog">
    <h2>Lägg till ställplats</h2>
    <div class="field"><label>Ställplats / plats</label><input id="fName" required></div>
    <div class="field"><label>Ort / område</label><input id="fArea"></div>
    <div class="field"><label>Landskap</label><input id="fRegion" required></div>
    <div class="field"><label>Pris ca</label><input id="fPrice" placeholder="t.ex. 250 kr"></div>
    <div class="field"><label>Körtid ca från Åkersberga</label><input id="fTime" placeholder="t.ex. 3 t 45 min"></div>
    <div class="field"><label>Koordinat eller adress (valfritt, för karta)</label><input id="fMap" placeholder="t.ex. 57.1234, 15.1234"></div>
    <div class="dlg-actions"><button type="button" id="cancelBtn">Avbryt</button><button class="save" type="submit">Spara</button></div>
  </form>
</dialog>

<script>
const DEFAULTS = [
[1,"Norje Båtklubb","Norje / Sölvesborg","Blekinge","?","6 t 45 min"],
[2,"Nogersunds ställplats","Nogersund / Sölvesborg","Blekinge","250 kr","6 t 50 min"],
[3,"Kosta Safari Park","Kosta","Småland","ca 250 kr","5 t 20 min"],
[4,"Sunset ställplats","Borgholm / Öland","Öland","fr. ca 275 kr","5 t 45 min"],
[5,"Skeda Strand","Rydaholm / Värnamo","Småland","fr. ca 150 kr","5 t 00 min"],
[6,"Hillerstorps hamn","Hillerstorp","Småland","?","5 t 20 min"],
[7,"Gränsöleden / Västervik","Västervik / Gränsö","Småland","?","3 t 50 min"],
[8,"Bondbacken / Gränsö","Västervik / Gränsö","Småland","fr. ca 100 kr","3 t 50 min"],
[9,"Savannen","Alingsås","Västergötland","?","5 t 30 min"],
[10,"Sandhem / Sägnernas Hus","Sandhem","Västergötland","ca 150 kr","4 t 55 min"],
[11,"Kohagens ställplats","Sandhem","Västergötland","?","5 t 00 min"],
[12,"The View Sweden","Brandstorp / Vättern","Västergötland","ca 200–250 kr","4 t 50 min"],
[13,"Henåns Gästhamn","Henån / Orust","Bohuslän","ca 160–275 kr","6 t 20 min"],
[14,"Stora Lunds naturreservat","Ödeshög","Östergötland","?","4 t 10 min"],
[15,"Ödeshögs Skidklubb / Skönatorpet","Ödeshög","Östergötland","ca 150 kr","4 t 10 min"],
[16,"Djäknesundet","Karlsborg","Västergötland","upp till ca 150 kr parkering","4 t 25 min"],
[17,"The Backyard","Lidköping","Västergötland","?","4 t 50 min"],
[18,"Granvik Vildmarkscamping","Karlsborg","Västergötland","ca 220–350 kr","4 t 20 min"],
[19,"Spikens Fiskehamn / ställplats","Kållandsö / Lidköping","Västergötland","350 kr inkl. el","5 t 00 min"],
[20,"Åmmebergs Båtklubb","Åmmeberg","Närke","ca 150 kr","3 t 50 min"],
[21,"Aspa Båtklubb","Aspabruk","Närke","ca 220 kr","4 t 05 min"],
[22,"Köping ställplats","Köping","Västmanland","?","2 t 25 min"],
[23,"Nylada badplats","Ekolsund / Enköping","Uppland","?","1 t 45 min"],
[24,"Koffsta ställplatser","Hedesunda","Gästrikland","ca 125 kr","2 t 50 min"],
[25,"Offroadcamp","Nornäs / Sörsjön","Dalarna","ca 350–490 kr","4 t 20 min"],
[26,"Ljusnedal / Lossenvägen","Ljusnedal / Funäsfjällen","Härjedalen","?","7 t 00 min"],
[27,"Barsta Camping","Nordingrå / Höga Kusten","Ångermanland","ca 310 kr","6 t 50 min"],
[28,"Lillängets vildmarkscamping","Bjurholms kommun","Ångermanland","kr","6 t 50 min"],
[29,"Bredträsk vildmarkscamping","Bjurholms kommun","Ångermanland","50 kr","6 t 50 min"]
].map(r=>({id:r[0],name:r[1],area:r[2],region:r[3],price:r[4],time:r[5],map:"",favorite:false}));

const KEY='stallplatser-pwa-v1';
let data=load();
let favOnly=false;
const els={search:document.getElementById('search'),region:document.getElementById('region'),sort:document.getElementById('sort'),favFilter:document.getElementById('favFilter'),count:document.getElementById('count'),list:document.getElementById('list'),clear:document.getElementById('clearBtn'),dialog:document.getElementById('addDialog'),add:document.getElementById('addBtn'),cancel:document.getElementById('cancelBtn'),form:document.getElementById('addForm')};

function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:structuredClone(DEFAULTS)}catch{return structuredClone(DEFAULTS)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function mapUrl(item){
  const q=item.map?.trim()||[item.name,item.area].filter(Boolean).join(', ');
  return 'https://maps.apple.com/?q='+encodeURIComponent(q);
}
function priceNum(s){const m=String(s||'').replace(/\s/g,'').match(/\d+(?:[,.]\d+)?/);return m?Number(m[0].replace(',','.')):999999}
function renderRegions(){const current=els.region.value;const regions=[...new Set(data.map(x=>x.region).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'sv'));els.region.innerHTML='<option value="">Alla landskap</option>'+regions.map(r=>`<option>${esc(r)}</option>`).join('');if(regions.includes(current))els.region.value=current}
function render(){
  const q=els.search.value.trim().toLowerCase(); const reg=els.region.value; const sort=els.sort.value;
  let arr=data.filter(x=>{const hay=[x.name,x.area,x.region,x.price,x.time].join(' ').toLowerCase();return (!q||hay.includes(q))&&(!reg||x.region===reg)&&(!favOnly||x.favorite)});
  if(sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'sv')); else if(sort==='region')arr.sort((a,b)=>a.region.localeCompare(b.region,'sv')||a.name.localeCompare(b.name,'sv')); else if(sort==='price')arr.sort((a,b)=>priceNum(a.price)-priceNum(b.price)); else arr.sort((a,b)=>a.id-b.id);
  els.count.textContent=`Visar ${arr.length} av ${data.length} ställplatser`;
  if(!arr.length){els.list.innerHTML='<div class="empty">Ingen ställplats matchar sökningen.</div>';return}
  els.list.innerHTML=arr.map(x=>`<article class="card">
    <div class="top"><div><div class="name">${esc(x.name)}</div><div class="place">${esc(x.area)}</div></div><div class="badge">${esc(x.region)}</div></div>
    <div class="meta"><div><div class="label">Pris</div><div class="value">${esc(x.price||'—')}</div></div><div><div class="label">Körtid</div><div class="value">${esc(x.time||'—')}</div></div></div>
    <div class="actions"><button class="primary" data-map="${x.id}">🗺 Öppna karta</button><button class="fav" data-fav="${x.id}" aria-label="Favorit">${x.favorite?'★':'☆'}</button><button data-del="${x.id}">Ta bort</button></div>
  </article>`).join('');
}
function nextId(){return data.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1}

els.search.addEventListener('input',render);els.region.addEventListener('change',render);els.sort.addEventListener('change',render);els.clear.addEventListener('click',()=>{els.search.value='';render()});
els.favFilter.addEventListener('click',()=>{favOnly=!favOnly;els.favFilter.textContent=favOnly?'★ Favoriter: bara':'☆ Favoriter: alla';render()});
els.list.addEventListener('click',e=>{
  const map=e.target.closest('[data-map]');if(map){const item=data.find(x=>x.id==map.dataset.map);location.href=mapUrl(item);return}
  const fav=e.target.closest('[data-fav]');if(fav){const item=data.find(x=>x.id==fav.dataset.fav);item.favorite=!item.favorite;save();render();return}
  const del=e.target.closest('[data-del]');if(del){const item=data.find(x=>x.id==del.dataset.del);if(confirm(`Ta bort "${item.name}"?`)){data=data.filter(x=>x.id!=del.dataset.del);save();renderRegions();render()}}
});
els.add.addEventListener('click',()=>{els.form.reset();els.dialog.showModal()});els.cancel.addEventListener('click',()=>els.dialog.close());
els.form.addEventListener('submit',e=>{e.preventDefault();data.push({id:nextId(),name:document.getElementById('fName').value.trim(),area:document.getElementById('fArea').value.trim(),region:document.getElementById('fRegion').value.trim(),price:document.getElementById('fPrice').value.trim()||'?',time:document.getElementById('fTime').value.trim()||'—',map:document.getElementById('fMap').value.trim(),favorite:false});save();renderRegions();render();els.dialog.close()});

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
renderRegions();render();
</script>
</body>
</html>
